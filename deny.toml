[graph]
all-features = true

[advisories]
git-fetch-with-cli = true
# A yanked crate in the lockfile is a build that cannot be reproduced: the
# committed lock still resolves, but any fresh resolution -- `cargo install
# --git` without `--locked`, or a new contributor's first build -- fails with
# no valid version to pick. cargo-deny warns by default, which is how every
# published `bisync` version came to sit in this lockfile through green CI
# until an install on another machine failed. Fail instead.
yanked = "deny"
ignore = [
  # INVARIANT-BYPASS(RS-006): chrono is unmaintained, not vulnerable, and no
  # version is unaffected. It arrives transitively through rmcp and schemars,
  # so removing kb's own use would not remove it. Revisit when rmcp drops it.
  { id = "RUSTSEC-2026-0543", reason = "transitive via rmcp/schemars; no fixed version" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "OpenSSL",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

skip = [
  { crate = "windows-sys" },
  { crate = "windows-targets" },
  { crate = "windows_aarch64_gnullvm" },
  { crate = "windows_aarch64_msvc" },
  { crate = "windows_i686_gnu" },
  { crate = "windows_i686_msvc" },
  { crate = "windows_x86_64_gnu" },
  { crate = "windows_x86_64_gnullvm" },
  { crate = "windows_x86_64_msvc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
