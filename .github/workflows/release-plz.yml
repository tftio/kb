name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read
  # The reusable workflow requests id-token: write for the crates.io OIDC
  # exchange. A called workflow cannot request a permission the caller does not
  # grant, so omitting this fails the run at startup.
  id-token: write

jobs:
  release-plz:
    uses: tftio/gh-actions/.github/workflows/release-plz.yml@v2.5.1
    with:
      app-id: ${{ vars.RELEASE_BOT_APP_ID }}
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
