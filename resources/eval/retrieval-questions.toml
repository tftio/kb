# Retrieval evaluation question set, read by `mise run eval:retrieval`,
# `kb mail scope`, and `kb mail index`.
#
# This committed file is synthetic. Every node id, Message-ID, title, and hash
# below is invented, so it resolves against no real corpus; it exists to pin
# the schema and to give the tests and tools a well-formed default. To measure
# retrieval over a real corpus, author a question set against that corpus and
# pass it with `--questions`.
#
# Each question names the nodes that genuinely answer it. A question is scored a
# hit at rank k when any `expect` entry matches a result inside the first k
# results, where a match is either `node_id` equality or a `title_regex` match
# against the result's title. `title` is not used for matching; it records the
# node's title as of authoring so that a corpus change producing a different
# title is visible as a mismatch rather than silently altering the measurement.
#
# `population` records which of the corpus's several populations the expected
# answer lives in, so aggregate metrics can be broken down by population. A set
# that samples only one population measures only that population.

schema_version = 1

# The corpus vocabulary, fixed here rather than by the registry. A registry
# that invented its own identifiers would silently break the join between an
# index row's corpus and an `expect` entry's, and the break would look like a
# retrieval regression rather than a naming mismatch.
#
# An `expect` entry with no `corpus` means "kb".
[corpora]
known = ["kb", "mail"]
default = "kb"

[corpus]
snapshot_date = "2026-09-30"
node_count = 0
database = "~/.local/share/kb/kb.db"
embedding_model = "example-embedding-model"
endpoint = "http://127.0.0.1:1234/v1"

