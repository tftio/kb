# ─── Mail ─────────────────────────────────────────────────────────────────────
#
# Each expectation records the Message-ID as its id, the folder it was found in,
# and a sha256 over the delivered bytes as of authoring. The filename is never an
# identifier: Maildir flags rewrite it on every flag change, so a filename cannot
# name a message across two syncs.
#
# A mail question may be answered by a message the bulk discriminant classifies
# as bulk. Such questions belong in a real set deliberately: without them the
# rule's false-negative direction is assumed rather than exercised, and the
# ground-truth override is what keeps them answerable.

[[question]]
id = "MQ01"
query = "what use cases did the customer want the pilot to cover"
population = "mail"
[[question.expect]]
corpus = "mail"
node_id = "<synthetic-01.02cf89023e67@example.invalid>"
title = "Fwd: Pilot scoping notes"
folder = "Archive"
content_sha256 = "5165c4fd9b6989eddeec4718c95dbf6408f92901218d0473c8df1ebd77246d99"
authored_year = "2022"

