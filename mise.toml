[tools]
rust = { version = "1.97.1", profile = "minimal", components = ["clippy", "rustfmt", "rust-src", "rust-analyzer", "llvm-tools"] }
prek = "0.4.13"
cocogitto = "7.0.0"
taplo = "0.10.0"
shellcheck = "0.11.0"
typos = "1.49.0"
ruff = "0.16.3"
# uv drives the Python side of this crate: check:locks, check:python-types
# and check:python-test all shell out to it. It was undeclared until
# 2026-09-08 because the retired CI image happened to carry it; on a
# GitHub-hosted runner the gate failed with "uv: not found". Same reasoning
# as the pandoc entry below.
uv = "0.12.3"
# pandoc backs `--markdown` import and the markdown module tests, which skip
# without it. Declared here so CI, which runs `mise install`, has it too.
pandoc = "3.11"
# Rust dev tools are declared here rather than pinned inside task bodies: only a
# `[tools]` declaration is visible to `mise upgrade --bump` and recorded in
# `mise.lock`. A version embedded in a task's shell string is invisible to both,
# and duplicating one across tasks lets the copies drift. The cargo backend
# records a version and backend but no checksum or provenance, unlike the aqua
# entries above.
"cargo:cargo-nextest" = "0.9.143"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-mutants" = "27.1.0"

[settings]
lockfile = true
# The only task permitted to rewrite a lockfile. Every other task, hook, and CI
# path is read-only with respect to mise.lock, Cargo.lock, and uv.lock, so a
# dependency moves when someone runs this and at no other time. Deliberately not
# wired into `check` or `ci`.
#
# `mise upgrade --bump` rewrites the pins in this file as well as installing;
# mise's minimum_release_age (24h by default) holds back releases younger than a
# day. `cargo update` stays within the semver requirements in Cargo.toml, so a
# major bump remains a manual manifest edit.
[tasks.update]
description = "Move every pinned dependency: mise tools, cargo crates, Python packages, prek hooks"
run = """
mise upgrade --bump --yes
cargo update
uv lock --upgrade
prek update
"""

# The read-only counterpart to `update`, and what makes it safe for directory
# entry to do nothing: a stale lockfile fails here, loudly, instead of being
# silently regenerated by a shell hook. Neither command writes — `cargo metadata
# --locked` errors rather than re-resolving, and `uv lock --check` reports
# without locking.
[tasks."check:locks"]
description = "Fail if any lockfile is stale; never write one"
run = """
cargo metadata --locked --format-version 1 > /dev/null
uv lock --check
"""

[tasks."hooks:install"]
description = "Install Git hooks through prek"
run = "prek install --install-hooks"

[tasks.check]
description = "Run check-only hooks exactly as CI does"
run = "prek run --hook-stage pre-commit --all-files"

[tasks.lint]
description = "Run manual autofix hooks"
run = "prek run --hook-stage manual --all-files"

[tasks.test]
description = "Run the Rust test suite with nextest"
run = "cargo nextest run --locked --all-features"

[tasks.ci]
description = "Run the full CI gate"
depends = ["check", "check:coverage"]

[tasks."check:fmt"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks."check:toml"]
description = "Check TOML formatting"
run = "taplo fmt --check"

[tasks."check:shell"]
description = "Lint shell entrypoints"
run = "shellcheck -s bash scripts/create-idea.sh scripts/kb-backup.sh scripts/kb-store-gc.sh scripts/session-end-kb.sh scripts/check-python-package.sh"

# Regenerates the gitignored `.idea/` from `resources/idea-template/`, labelled
# with this worktree's name. A direnv hook used to run this on directory entry; it
# is operator-invoked now, because entering a directory must not write to it. Run it
# once per new worktree if you use the IDE integration.
[tasks."setup:idea"]
description = "Regenerate .idea/ from the template for this worktree"
run = "sh scripts/create-idea.sh"

[tasks.backup]
description = "Snapshot the kb database into a backed-up directory, keeping a week"
run = "bash scripts/kb-backup.sh"

# Reconciliation, scheduled beside the backup rather than triggered by a file
# watcher. Comparing content addresses is idempotent, so a run that is missed
# costs latency rather than correctness and a run that repeats costs a
# comparison — which is what makes the schedule a free choice instead of part
# of the correctness argument. Reports only; pass `--repair` to re-derive what
# differs.
[tasks.fsck]
description = "Reconcile the derived index against the store, reporting drift"
run = "cargo run --quiet --release --locked -- fsck"

# The store's counterpart to `backup`. The index is snapshotted because it is a
# single mutating file; the store is packed because it is an append-only object
# database whose cost is loose objects. Run it against a scratch store with
# `KB_STORE_PATH=/tmp/store mise run store:gc`.
[tasks."store:gc"]
description = "Pack the kb blob store; never prunes, so superseded content survives"
run = "bash scripts/kb-store-gc.sh"

# The wiki's counterpart to `fsck`, and scheduled beside it for the same
# reason: a projector that is not rerun after ingest diverges from the store
# quietly, and the projection is only honest state while something re-derives
# it. Reports orphan pages; pass `--prune` to remove them.
[tasks.project]
description = "Render the store into the SilverBullet space; reports rather than prunes"
run = "cargo run --quiet --release --locked -- project"

[tasks."check:spelling"]
description = "Check spelling"
run = "typos --format brief"

[tasks."check:clippy"]
description = "Run clippy with warnings denied"
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

# ── Python gate ────────────────────────────────────────────────────────────
# The repository's Python is the kb-import package under `python/`, the other
# dev scripts (`scripts/eval_retrieval.py` and the rest), and their tests.
# `pyrefly` and `pytest` are not in the mise registry, so they are pinned by
# `pyproject.toml` + `uv.lock` rather than by `[tools]`. `--locked` makes these
# invocations fail rather than re-lock, which keeps them read-only; `mise run
# update` is the only task that may move these pins.

[tasks."check:python-lint"]
description = "Lint and format-check Python sources"
run = """
ruff check python scripts tests
ruff format --check python scripts tests
"""

[tasks."check:python-types"]
description = "Type-check Python sources with pyrefly"
run = "uv run --quiet --locked --group dev -- pyrefly check"

[tasks."check:python-test"]
description = "Run the Python test suite"
run = "uv run --quiet --locked --group dev -- pytest tests -q"

# Builds the kb-import wheel and sdist into a fresh temporary directory,
# checks their contents, and installs the wheel into a throwaway
# UV_TOOL_DIR/UV_TOOL_BIN_DIR so the operator's real `uv tool` state is never
# touched. Read-only with respect to every lockfile: `uv build` does not lock.
[tasks."check:python-package"]
description = "Build, inspect, and install the kb-import wheel and sdist in isolation"
run = "bash scripts/check-python-package.sh"

[tasks."fix:python"]
description = "Apply ruff fixes and formatting to Python sources"
run = """
ruff check --fix python scripts tests
ruff format python scripts tests
"""

[tasks."check:test"]
description = "Run tests"
run = "cargo nextest run --locked --all-features"

[tasks."check:doc"]
description = "Build docs with warnings denied"
run = 'RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features'

[tasks."check:deps"]
description = "Detect unused dependencies"
run = "cargo machete"

[tasks."check:audit"]
description = "Audit dependency advisories"
run = "cargo audit"

[tasks."check:deny"]
description = "Check licenses, bans, advisories, and sources"
run = "cargo deny --locked check"

[tasks."check:package"]
description = "Verify the crate package"
run = "cargo package --locked --allow-dirty"

[tasks."check:coverage"]
description = "Require the repository-local line-coverage floor (93%)"
# 93, not 94: the CI image has no `mu`, so the mail-search paths gated on it are
# not exercised there and CI measures about 0.4 points below a laptop with mu
# installed. Restore 94 when the ci-components image carries maildir-utils.
run = "cargo llvm-cov nextest --locked --all-features --fail-under-lines 93"

[tasks."fix:fmt"]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks."fix:toml"]
description = "Format TOML files"
run = "taplo fmt"

[tasks."fix:spelling"]
description = "Apply spelling fixes"
run = "typos --write-changes"

# Operator-invoked measurement, deliberately not part of `check` or `ci`: it
# needs a populated database and a reachable embedding endpoint, and neither
# exists in CI. Wiring it into a required gate would turn an unavailable
# endpoint into a red build rather than into the loud local failure the harness
# already raises. Extra arguments are forwarded, so
# `mise run eval:retrieval -- --label baseline` names a run.
[tasks."eval:retrieval"]
description = "Measure kb retrieval quality against the ground-truth question set"
run = "uv run --quiet --locked --group dev -- python scripts/eval_retrieval.py"

# The serving-workload measurement behind T025, operator-invoked for the
# same reason as `eval:retrieval`: it needs a populated index, an embedding
# endpoint and a reranker, and it copies the live store and index into a
# snapshot that the ingest and reindex conditions then write to. Extra
# arguments are forwarded; `--workdir` is required, e.g.
# `mise run bench:serving -- --workdir /tmp/t025 --rerank-url http://127.0.0.1:8081`.
[tasks."bench:serving"]
description = "Measure the served SQLite index under T025's concurrency, ingest and reindex matrix"
run = "uv run --quiet --locked --group dev -- python scripts/bench_serving.py"

[tasks."verify:embedding-endpoint"]
description = "Confirm by fingerprint which model the embedding endpoint is serving"
run = "cargo test --locked --all-features --test embedding_endpoint -- --ignored --nocapture"

[tasks."exhaustive:mutants"]
description = "Run mutation testing"
run = "cargo mutants --all-features"

[tasks."release:version"]
description = "cocogitto pre_bump_hook: set the crate version and sync Cargo.lock"
run = 'cargo set-version {{arg(name="version")}}'

[tasks."release:publish"]
description = "cocogitto post_bump_hook: publish the crate when PUBLISH_ENABLED"
run = """
if [ "${PUBLISH_ENABLED:-false}" = "true" ]; then
  cargo publish
else
  echo "PUBLISH_ENABLED is not true; skipping crate publish."
fi
"""

[tasks.build]
description = "Compile the release binary for $BUILD_TARGET and stage it into dist/"
run = """
cargo build --locked --release --target "$BUILD_TARGET"
mkdir -p dist
install -Dm755 "target/$BUILD_TARGET/release/kb" "dist/kb-$BUILD_TARGET"
"""
